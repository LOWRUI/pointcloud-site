name: Publish download site

on:
  # Every push that touches the page, the data file or the generator.
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  # Refresh the snapshot from CrabNebula Cloud once a day, and on demand.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Every action below runs on the Node 24 runtime. The previous v4/v5 majors
      # shipped node20 entry points, which the runner now force-migrates and
      # reports as a deprecation notice on each run.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Refresh public/releases.json from CrabNebula Cloud. The generator exits 0
      # and leaves the file untouched when the token is empty, which used to make
      # a scheduled run report success while publishing a frozen snapshot. A
      # missing token is a warning on push runs and a hard failure when an
      # automatic or manual refresh is requested.
      - name: Refresh the release snapshot
        env:
          CRABNEBULA_TOKEN: ${{ secrets.CRABNEBULA_TOKEN }}
        run: |
          if [ -z "$CRABNEBULA_TOKEN" ]; then
            if [ "$GITHUB_EVENT_NAME" != "push" ]; then
              echo "::error title=缺少 CRABNEBULA_TOKEN::刷新需要 Cloud API key。请在 Settings → Secrets and variables → Actions 添加仓库级 secret CRABNEBULA_TOKEN（对 hbzsy 组织有读权限）。"
              exit 1
            fi
            echo "::warning title=清单未刷新::没有 CRABNEBULA_TOKEN，本次只发布仓库中签入的 public/releases.json。"
          fi
          node scripts/fetch-releases.mjs --verbose

      # With a token the generator always rewrites generatedAt, so an untouched
      # file means the script never reached the directory API at all.
      - name: Confirm the snapshot was regenerated
        env:
          CRABNEBULA_TOKEN: ${{ secrets.CRABNEBULA_TOKEN }}
        run: |
          if [ -n "$CRABNEBULA_TOKEN" ] && git diff --quiet -- public/releases.json; then
            echo "::error title=清单没有更新::token 已提供，但 public/releases.json 没有被重写，说明请求没有真正打到 Cloud 目录接口。"
            exit 1
          fi

      # The run page answers "what did the last refresh actually publish", so a
      # stale snapshot is visible without opening the job log.
      - name: Summarize the snapshot
        if: always()
        env:
          CRABNEBULA_TOKEN: ${{ secrets.CRABNEBULA_TOKEN }}
        run: |
          node -e 'const d=JSON.parse(require("node:fs").readFileSync("public/releases.json","utf8"));const rows=Object.entries(d.latestByPlatform||{}).map(([p,v])=>"| "+p+" | "+v.version+" |");const lines=["### 发布清单","","| 平台 | 最新版本 |","| --- | --- |",...rows,"","生成时间："+d.generatedAt,"Cloud token："+(process.env.CRABNEBULA_TOKEN?"已配置":"未配置")];console.log(lines.join("\n"))' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate the static download content
        run: npm run build

      - name: Check the page and its data
        run: |
          test -f public/index.html
          test -f public/releases.json
          node --check public/app.js
          node --check public/releases-refresh.js
          node --check public/releases-model.js
          node --check public/releases-view.js
          node --check scripts/render-page.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('public/releases.json', 'utf8'))"
          npm test

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
