name: Publish download site

on:
  # Every push that touches the page, the data file or the generator.
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/fetch-releases.mjs"
      - ".github/workflows/pages.yml"
  # Refresh the snapshot from CrabNebula Cloud once a day, and on demand.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Every action below runs on the Node 24 runtime. The previous v4/v5 majors
      # shipped node20 entry points, which the runner now force-migrates and
      # reports as a deprecation notice on each run.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Refresh public/releases.json when a Cloud token is configured. The script
      # exits 0 and changes nothing when the variable is empty, so the
      # checked-in snapshot is published as-is until a secret is added.
      - name: Refresh the release snapshot
        env:
          CRABNEBULA_TOKEN: ${{ secrets.CRABNEBULA_TOKEN }}
        run: node scripts/fetch-releases.mjs

      # The page is hand-written, so a syntax slip ships straight to the CDN.
      # This catches it before the artifact is built.
      - name: Check the page and its data
        run: |
          test -f public/index.html
          test -f public/releases.json
          node --check public/app.js
          node -e "JSON.parse(require('node:fs').readFileSync('public/releases.json', 'utf8'))"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
